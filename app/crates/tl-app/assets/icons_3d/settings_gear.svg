<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <g transform-origin="26 30">
    <animateTransform attributeName="transform" type="rotate" from="0 26 30" to="360 26 30" dur="8s" repeatCount="indefinite"/>
    <circle cx="26" cy="30" r="14" fill="none" stroke="#D4AF37" stroke-width="4" stroke-dasharray="5 3"/>
    <circle cx="26" cy="30" r="8" fill="#1B2636" stroke="#26B2EE" stroke-width="2"/>
  </g>
  <g transform-origin="45 43">
    <animateTransform attributeName="transform" type="rotate" from="360 45 43" to="0 45 43" dur="5.3s" repeatCount="indefinite"/>
    <circle cx="45" cy="43" r="9.5" fill="none" stroke="#18BC6C" stroke-width="3.2" stroke-dasharray="4 2.5"/>
    <circle cx="45" cy="43" r="4.5" fill="#1B2636" stroke="#D4AF37" stroke-width="1.5"/>
  </g>
</svg>
